<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>바로매치 | 로그인</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #fff; }
  .bm-login-page {
    min-height: 100vh;
    padding: 0;
    background: #fff;
  }
  .bm-login-inner {
    padding: 50px 24px 0;
  }
  .bm-login-tagline {
    margin: 0 0 14px;
    text-align: center;
    color: #9b9b9b;
    font-size: 14px;
    line-height: 1.35;
    font-weight: 800;
  }
  .bm-login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
  }
  .bm-login-logo-icon {
    width: 45px;
    height: 64px;
    margin-bottom: 3px;
  }
  .bm-login-logo-main {
    color: #20248b;
    font-size: 28px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0;
  }
  .bm-login-logo-sub {
    margin-top: 5px;
    color: #a0a0a0;
    font-size: 12px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.09em;
  }
  .bm-login-field-group {
    margin-bottom: 21px;
  }
  .bm-login-field-group label {
    display: block;
    margin-bottom: 9px;
    color: #666;
    font-size: 14px;
    line-height: 1.2;
    font-weight: 900;
  }
  .bm-login-input {
    display: flex;
    align-items: center;
    height: 46px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    background: #edf4ff;
    padding: 0 15px;
  }
  .bm-login-input:focus-within {
    border-color: #20248b;
    background: #edf4ff;
  }
  .bm-login-input input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #000;
    font-size: 15px;
    line-height: 1;
    font-weight: 500;
  }
  .bm-login-eye {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin-left: 8px;
    border: none;
    background: none;
    color: #b7b7b7;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bm-login-options {
    display: flex;
    align-items: center;
    margin: 0 0 20px;
  }
  .bm-login-check {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #6a6a6a;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .bm-login-check input {
    width: 16px;
    height: 16px;
    margin: 0;
    accent-color: #20248b;
  }
  .bm-login-submit {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 8px;
    background: #20248b;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
  }
  .bm-login-submit:active {
    background: #171b72;
  }
  .bm-login-find {
    display: block;
    width: max-content;
    margin: 24px auto 0;
    border: none;
    background: none;
    color: #777;
    font-size: 14px;
    font-weight: 800;
    padding: 0;
    cursor: pointer;
  }
  .bm-login-demo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    border-radius: 9px;
    background: #eef0fb;
    color: #20248b;
    min-height: 38px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.25;
    font-weight: 700;
    text-align: center;
  }
  .bm-login-demo svg {
    flex-shrink: 0;
  }
  .bm-login-demo span {
    min-width: 0;
  }
  .bm-login-demo strong {
    font-weight: 900;
  }
  @media (max-width: 374px) {
    .bm-login-inner { padding-left: 18px; padding-right: 18px; }
    .bm-login-demo { font-size: 12px; gap: 6px; }
  }
</style>
</head>
<body>
<div class="bm-page bm-login-page">
  <main class="bm-login-inner">
    <p class="bm-login-tagline">내 주변 전문가 바로매칭 서비스</p>

    <div class="bm-login-logo" aria-label="바로매치">
      <svg class="bm-login-logo-icon" viewBox="0 0 64 86" fill="none" aria-hidden="true">
        <path d="M32 84C32 84 3 44.9 3 30.4C3 14.9 16 2 32 2C48 2 61 14.9 61 30.4C61 44.9 32 84 32 84Z" fill="#20248b"/>
        <circle cx="32" cy="31" r="10.5" fill="#fff"/>
      </svg>
      <div class="bm-login-logo-main">바로매치</div>
      <div class="bm-login-logo-sub">BARO MATCH</div>
    </div>

    <form id="bm-login-form">
      <div class="bm-login-field-group">
        <label for="bm-login-id">아이디</label>
        <div class="bm-login-input">
          <input id="bm-login-id" type="text" value="m23456789" autocomplete="username">
        </div>
      </div>

      <div class="bm-login-field-group">
        <label for="bm-login-pw">비밀번호</label>
        <div class="bm-login-input">
          <input id="bm-login-pw" type="password" value="m23456789!@" autocomplete="current-password">
          <button id="bm-pw-toggle" class="bm-login-eye" type="button" aria-label="비밀번호 보기">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="bm-login-options">
        <label class="bm-login-check">
          <input id="bm-auto-login" type="checkbox">
          자동 로그인
        </label>
      </div>

      <button class="bm-login-submit" type="submit">로그인</button>
    </form>

    <button id="bm-find-account" class="bm-login-find" type="button">아이디 / 비밀번호 찾기</button>

    <div class="bm-login-demo">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#20248b" aria-hidden="true"><circle cx="12" cy="12" r="11"/><rect x="11" y="10" width="2" height="7" rx="1" fill="#fff"/><circle cx="12" cy="7" r="1.2" fill="#fff"/></svg>
      <span>Demo 계정 ID: <strong>m23456789</strong>&nbsp;&nbsp;,&nbsp;&nbsp;PW: <strong>m23456789!@</strong></span>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const BM_LOGIN_KEY = 'BAROMATCH_LOGGED_IN_V1';
const BM_AUTO_LOGIN_KEY = 'BAROMATCH_AUTO_LOGIN_V1';

if (localStorage.getItem(BM_AUTO_LOGIN_KEY) === 'Y') {
  document.getElementById('bm-auto-login').checked = true;
}

document.getElementById('bm-pw-toggle').addEventListener('click', () => {
  const input = document.getElementById('bm-login-pw');
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  document.getElementById('bm-pw-toggle').setAttribute('aria-label', visible ? '비밀번호 보기' : '비밀번호 숨기기');
});

document.getElementById('bm-login-form').addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('bm-login-id').value.trim();
  const pw = document.getElementById('bm-login-pw').value;

  if (!id || !pw) {
    showBmAlert('아이디와 비밀번호를 입력해 주세요.');
    return;
  }

  localStorage.setItem(BM_LOGIN_KEY, 'true');
  if (document.getElementById('bm-auto-login').checked) localStorage.setItem(BM_AUTO_LOGIN_KEY, 'Y');
  else localStorage.removeItem(BM_AUTO_LOGIN_KEY);
  window.location.href = 'index.html';
});

document.getElementById('bm-find-account').addEventListener('click', () => {
  showBmAlert('Demo 계정\nID: m23456789\nPW: m23456789!@');
});
</script>
</body>
</html>
